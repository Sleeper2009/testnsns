name: Build LiquidMorphDiag

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /home/runner/theos
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Theos (bao gồm toolchain + sdks)
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: theos-${{ runner.os }}-v2

      - name: Install Theos (script chính thức, tự tải toolchain + sdk)
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          NONINTERACTIVE=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build package
        run: |
          export THEOS=/home/runner/theos
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidMorphDiag-deb
          path: packages/*.deb
